[node]
wallet  = ""
port    = 3000
datadir = "~/.etl/chain"
pruning = true             # false = nœud archive (explorateur, bootstrap) : garde tout
prune_keep_blocks = 90     # contenu des blocs conservé (~90 jours) ; en-têtes et genesis toujours gardés

[network]
chain_id    = "ETL-FR"   # inclus dans toute signature — fixé au genesis
address_hrp = "etl"      # préfixe des adresses bech32m (etl1…)
bootstrap = [
  "etl1.etalon-etl.fr:3000",
]
max_outbound = 8          # connexions sortantes
max_inbound  = 64         # connexions entrantes (0 si le nœud n'est pas joignable de l'extérieur)
ban_hours    = 24         # bannissement d'un pair qui envoie des données invalides

[block]
time_utc  = "23:00"
daily_reward = 10.0  # ETL/jour, partagés entre tous les participants — émission constante, pas de halving
target_bits = 21   # difficulté PoW fixe (~2 s CPU) — gouvernable par vote 2/3

[transaction]
fee_bps = 10           # points de base : 10 = 0.1%
fee_min = 0.0001       # frais minimum par transaction (ETL) — anti-spam
max_block_txs = 100000 # transactions par bloc (= débit quotidien) — gouvernable

confirm_small = 1
confirm_large = 2
confirm_threshold = 10.0

[mempool]               # limites locales au nœud (pas des règles de consensus)
max_per_account = 16
max_total = 200000
max_age_days = 7

[oracle]
ipc_url       = "https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011814630"
ipc_country   = "FR"
ipc_frequency = "quarterly"

[dashboard]
port = 3001
