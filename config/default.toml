[node]
wallet  = ""
port    = 3000
datadir = "~/.etl/chain"
pruning = true

[network]
chain_id    = "ETL-FR"   # inclus dans toute signature — fixé au genesis
address_hrp = "etl"      # préfixe des adresses bech32m (etl1…)
bootstrap = [
  "etl1.etalon-etl.fr:3000",
]

[block]
time_utc  = "23:00"
reward    = 10.0
halving_years = 2

[transaction]
fee_bps = 10           # points de base : 10 = 0.1%
confirm_small = 1
confirm_large = 2
confirm_threshold = 10.0

[oracle]
ipc_url       = "https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011814630"
ipc_country   = "FR"
ipc_frequency = "quarterly"

[dashboard]
port = 3001
